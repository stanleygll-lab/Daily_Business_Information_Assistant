ai:
  enabled: true
  provider: "gemini"
  model: "gemini-2.5-flash-lite"
  api_key: ""
  base_url: ""
  temperature: 0.2
  prompt: |
    你是一位资深的ToB销售商机分析师。请对以下新闻进行研判：
    1. 判断是否属于目标行业（医疗/教育/交通/军工/运营商）；
    2. 判断是否涉及指定业务（安全/合规/AI/数据要素/实训）；
    3. 如果符合，提炼出一句话商业价值事实摘要（30字以内，重点突出采购主体、项目金额、中标方或核心采购诉求）。
    格式严格：序号. 行业: [行业名] | 摘要内容

scheduler:
  enabled: false
  daily_time: "08:30"

dedup:
  log_file: "./data/news_dedup_log_sales.json"
  expiry_days: 7
