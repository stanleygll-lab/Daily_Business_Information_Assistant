sources:
  ccgp:
    enabled: true
    time_type: 1
    keywords:
      - "网络安全"
      - "数据安全"
      - "实训"
      - "靶场"
      - "安全测评"
      - "密码应用"
      - "信息化"
      - "数字化"

  baidu_news:
    enabled: true
    queries:
      - "医疗 网络安全 中标"
      - "高校 数据安全 招标"
      - "交通 数智化 采购"
      - "运营商 5G安全 入围"
      - "军工 信息化 招标"

  toutiao_bidding:
    enabled: true
    queries:
      - "医疗行业 中标"
      - "教育高校 招标"
      - "交通网络 采购"
      - "运营商 招标入围"

  rss_feeds:
    - name: "36氪商业"
      url: "https://www.36kr.com/feed"
      enabled: true
      max_items: 8
    - name: "FreeBuf企业安全"
      url: "https://www.freebuf.com/feed"
      enabled: true
      max_items: 8

ai:
  enabled: true
  provider: "gemini"
  model: "gemini-2.5-flash-lite"
  api_key: ""
  base_url: ""
  temperature: 0.2
  prompt: |
    你是一位资深的ToB销售商机分析师。请对以下新闻进行研判：
    1. 判断是否属于目标行业（医疗/教育/交通/军工/运营商）；
    2. 判断是否涉及指定业务（安全/合规/AI/数据要素/实训）；
    3. 如果符合，提炼出一句话商业价值事实摘要（30字以内，重点突出采购主体、项目金额、中标方或核心采购诉求）。
    格式严格：序号. 行业: [行业名] | 摘要内容

scheduler:
  enabled: false
  daily_time: "08:30"

dedup:
  log_file: "./data/news_dedup_log_sales.json"
  expiry_days: 7
